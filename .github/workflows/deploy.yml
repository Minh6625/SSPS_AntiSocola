name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Deploy to server
        # Cấu hình deployment tùy theo môi trường của bạn
        # Ví dụ: Deploy to Azure, AWS, hoặc server riêng
        run: |
          echo "Deploy backend to production server"
          # Thêm các bước deploy cụ thể ở đây
          # ssh, scp, hoặc các tool khác

  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to server
        # Cấu hình deployment tùy theo môi trường của bạn
        # Ví dụ: Deploy to Vercel, Netlify, hoặc server riêng
        run: |
          echo "Deploy frontend to production server"
          # Thêm các bước deploy cụ thể ở đây
