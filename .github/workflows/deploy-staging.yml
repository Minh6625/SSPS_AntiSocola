name: Deploy to Staging (Develop)

on:
  push:
    branches: [develop]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy-backend-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Deploy to staging server
        # Cấu hình deployment cho môi trường staging/develop
        # Ví dụ: Deploy to staging server
        run: |
          echo "Deploy backend to staging server (develop environment)"
          # Thêm các bước deploy cụ thể ở đây
          # ssh, scp, hoặc các tool khác

  deploy-frontend-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: staging

      - name: Deploy to staging server
        # Cấu hình deployment cho môi trường staging/develop
        # Ví dụ: Deploy to Vercel preview, hoặc staging server
        run: |
          echo "Deploy frontend to staging server (develop environment)"
          # Thêm các bước deploy cụ thể ở đây
