name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      # Tạm thời tắt semantic PR validation
      # - name: Check PR title
      #   uses: amannn/action-semantic-pull-request@v5
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     types: |
      #       feat
      #       fix
      #       docs
      #       style
      #       refactor
      #       perf
      #       test
      #       build
      #       ci
      #       chore
      #       revert
      #     requireScope: false

      - name: Check for merge conflicts
        uses: eps1lon/actions-label-merge-conflict@releases/2.x
        with:
          dirtyLabel: "merge-conflict"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"

      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event.action == 'opened'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '👋 Cảm ơn bạn đã tạo Pull Request!\n\n✅ CI/CD workflows sẽ tự động chạy để kiểm tra code.\n\n📝 Hãy đảm bảo:\n- [ ] Code đã được test kỹ\n- [ ] Không có breaking changes\n- [ ] Documentation đã được cập nhật\n\nReviewers sẽ xem xét PR của bạn sớm nhất có thể! 🚀'
            })
