name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  # ==================== STAGE: INSTALL ====================
  install-backend:
    name: "📦 Install Backend Dependencies"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install dependencies
        working-directory: ./backend
        run: mvn dependency:go-offline -B

  install-frontend:
    name: "📦 Install Frontend Dependencies"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

  # ==================== STAGE: BUILD ====================
  build-backend:
    name: "🔨 Build Backend"
    runs-on: ubuntu-latest
    needs: [install-backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Restore Maven cache
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Run tests
        working-directory: ./backend
        run: mvn test

      - name: Build JAR
        working-directory: ./backend
        run: mvn package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  build-frontend:
    name: "🔨 Build Frontend"
    runs-on: ubuntu-latest
    needs: [install-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Restore node_modules cache
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build application
        working-directory: ./frontend
        run: npm run build || exit 0
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next
            frontend/package.json
          retention-days: 7

  # ==================== STAGE: DEPLOY ====================
  deploy-staging:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.ssps.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./artifacts/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./artifacts/frontend

      - name: Deploy Backend to Staging
        run: |
          echo "🚀 Deploying backend JAR to staging server..."
          echo "JAR file: $(ls ./artifacts/backend/*.jar)"
          # TODO: Add actual deployment steps
          # Example: scp, rsync, docker push, etc.

      - name: Deploy Frontend to Staging
        run: |
          echo "🚀 Deploying frontend to staging server..."
          echo "Build folder: ./artifacts/frontend/.next"
          # TODO: Add actual deployment steps
          # Example: Vercel, Netlify, or custom server

  deploy-production:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ssps.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./artifacts/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./artifacts/frontend

      - name: Deploy Backend to Production
        run: |
          echo "🚀 Deploying backend JAR to production server..."
          echo "JAR file: $(ls ./artifacts/backend/*.jar)"
          # TODO: Add actual deployment steps

      - name: Deploy Frontend to Production
        run: |
          echo "🚀 Deploying frontend to production server..."
          echo "Build folder: ./artifacts/frontend/.next"
          # TODO: Add actual deployment steps

  # ==================== STAGE: TEST ====================
  smoke-test:
    name: "🧪 Smoke Tests"
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Test Backend Health
        run: |
          echo "🧪 Testing backend health endpoint..."
          # curl -f https://staging-api.ssps.example.com/health || exit 1

      - name: Test Frontend Load
        run: |
          echo "🧪 Testing frontend accessibility..."
          # curl -f https://staging.ssps.example.com || exit 1

      - name: Run basic API tests
        run: |
          echo "🧪 Running smoke tests..."
          # TODO: Add actual smoke tests
          # Example: newman run collection.json, pytest, etc.
