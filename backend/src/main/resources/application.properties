# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=${APP_NAME:layered-architecture-backend}

# Database Configuration (SQL Server)
spring.datasource.url=jdbc:sqlserver://26.188.69.156:1433;databaseName=HCMSIU_SSPS;encrypt=true;trustServerCertificate=true
spring.datasource.username=user_khach
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Configuration
jwt.secret=${JWT_SECRET:hcmiu-ssps-secret-key-for-jwt-token-generation-2024-minimum-256-bits}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Email Configuration (OTP & Notifications)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP Configuration
otp.length=${OTP_LENGTH:6}
otp.expiration.minutes=${OTP_EXPIRATION_MINUTES:10}
otp.max.attempts=${OTP_MAX_ATTEMPTS:5}
otp.resend.cooldown.seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# Email Templates
email.from.address=${MAIL_FROM_ADDRESS:no-reply@ssps.hcmiu.edu.vn}
email.from.name=${MAIL_FROM_NAME:HCMIU SSPS System}
email.otp.subject=Mã xác thực OTP - HCMIU SSPS

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:51MB}

# Supabase Configuration
supabase.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.key=${SUPABASE_KEY:your-supabase-anon-key}
supabase.bucket-name=${SUPABASE_BUCKET_NAME:documents}

# Print Queue Configuration
print.queue.enabled=${PRINT_QUEUE_ENABLED:false}
print.queue.scan-interval-seconds=${PRINT_QUEUE_SCAN_INTERVAL:30}
print.queue.max-retry-attempts=${PRINT_QUEUE_MAX_RETRY:3}
print.queue.connection-timeout-seconds=${PRINT_QUEUE_TIMEOUT:10}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.app=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

